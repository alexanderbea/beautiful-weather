<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Beautiful Weather</title>
    <meta name="theme-color" content="#0b1428" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Weather" />
    <link rel="stylesheet" href="/src/styles.css" />
    <!-- Optional runtime key injection, e.g. from a hosting template:
    <script>window.__WEATHER_API_KEY = '...';</script> -->
  </head>
  <body>
    <canvas id="scene" aria-hidden="true"></canvas>
    <main id="overlay" class="overlay" aria-live="polite"></main>
    <button id="menu-button" class="menu-button" type="button" aria-controls="forecast-menu" aria-expanded="false" aria-label="Open forecast menu" title="Forecast">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path class="menu-button__bars" d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11"/><path class="menu-button__x" d="M4 4l8 8M12 4l-8 8"/></svg>
    </button>
    <section id="forecast-menu" class="menu" aria-label="Forecast" data-state="closed">
      <button type="button" class="menu__handle" data-el="handle" aria-controls="forecast-menu"><span class="menu__grip" aria-hidden="true"></span></button>
      <div class="menu__body">
        <div class="forecast-controls" id="forecast-controls"></div>
        <label class="scene-picker">Scene <select id="atmosphere" aria-label="Atmospheric scene"><option value="live">Live weather</option><option value="eclipse">Eclipse · imagined</option><option value="meteors">Meteor shower · night demo</option></select></label>
        <div class="forecast" id="forecast"></div>
      </div>
      <div class="menu__now">
        <p class="menu__caption" id="preview-caption" role="status"></p>
        <button type="button" class="menu__back" id="back-to-now" aria-disabled="true">Back to now</button>
      </div>
      <div class="menu__foot" id="menu-foot"></div>
    </section>
    <aside id="dev" class="dev" hidden></aside>
    <div id="audio-ctl" class="audio-ctl" role="group" aria-label="Ambient sound"></div>
    <nav id="landscape-picker" class="style-picker style-picker--landscape" aria-label="Landscape"></nav>
    <nav id="style-picker" class="style-picker" aria-label="Art style"></nav>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
