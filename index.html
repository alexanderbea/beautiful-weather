<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Beautiful Weather</title>
    <meta name="theme-color" content="#0b1428" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Weather" />
    <link rel="stylesheet" href="/src/styles.css" />
    <!-- Optional runtime key injection, e.g. from a hosting template:
    <script>window.__WEATHER_API_KEY = '...';</script> -->
  </head>
  <body>
    <canvas id="scene" aria-hidden="true"></canvas>
    <main id="overlay" class="overlay" aria-live="polite"></main>
    <aside id="dev" class="dev" hidden></aside>
    <div id="audio-ctl" class="audio-ctl" role="group" aria-label="Ambient sound"></div>
    <label class="scene-picker">Scene <select id="atmosphere" aria-label="Atmospheric scene"><option value="live">Live weather</option><option value="eclipse">Eclipse · imagined</option><option value="meteors">Meteor fall · imagined</option></select></label>
    <nav id="style-picker" class="style-picker" aria-label="Art style"></nav>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
